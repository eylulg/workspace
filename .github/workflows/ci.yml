name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    secrets:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    commitlint:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            # package.json depends on file:../ui, so the component library has to sit next to this checkout.
            # actions/checkout cannot write outside the workspace, so check it out here and move it up a level.
            - uses: actions/checkout@v4
              with:
                  repository: eylulg/ui
                  path: ui-src
            - name: Build the component library
              run: |
                  mv ui-src ../ui
                  npm --prefix ../ui ci
                  npm --prefix ../ui run build
            - run: npm ci
            - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

    checks:
        runs-on: ubuntu-latest
        env:
            # No DATABASE_URL: tests, the build and the end to end suite run on PGlite.
            NEXT_TELEMETRY_DISABLED: 1
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            # package.json depends on file:../ui, so the component library has to sit next to this checkout.
            # actions/checkout cannot write outside the workspace, so check it out here and move it up a level.
            - uses: actions/checkout@v4
              with:
                  repository: eylulg/ui
                  path: ui-src
            - name: Build the component library
              run: |
                  mv ui-src ../ui
                  npm --prefix ../ui ci
                  npm --prefix ../ui run build
            - run: npm ci
            - name: Typecheck
              run: npm run typecheck
            - name: Lint
              run: npm run lint
            - name: Format
              run: npm run format:check
            - name: Unused files, exports and dependencies
              run: npm run knip
            - name: Test
              run: npm test
            - name: Build
              run: npm run build
            - name: Install Playwright browser
              run: npx playwright install --with-deps chromium
            - name: End to end
              run: npm run test:e2e
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: playwright-report
                  retention-days: 7
